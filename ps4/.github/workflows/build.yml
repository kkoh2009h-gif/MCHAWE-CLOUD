name: Build PS4 PKG

on:
  workflow_dispatch:
  push:
    paths:
      - 'ps4/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build using OpenOrbis Toolchain
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.4
          command: cd ps4 && make
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: MCHAWE-CLOUD-PS4-build
          path: ps4/eboot.bin
