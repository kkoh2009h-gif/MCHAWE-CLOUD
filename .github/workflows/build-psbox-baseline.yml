name: Build PSBox PS4 baseline

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-psbox-baseline.yml'

permissions:
  contents: read

jobs:
  build-ps4-baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout upstream PSBox
        uses: actions/checkout@v4
        with:
          repository: RafaelNGP/psbox-cloud-gaming
          ref: 40c61da5fc9720e5078b0d1473931864488aa1b1
          submodules: recursive
          path: psbox

      - name: Inspect pinned source and environment
        working-directory: psbox
        run: |
          echo "Pinned upstream revision:"
          git rev-parse HEAD
          echo "Submodule status:"
          git submodule status
          echo "Host tools before setup:"
          cmake --version
          ninja --version
          clang --version | head -n 2
          python3 --version
          git status --short

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang llvm lld python3 curl nasm build-essential pkg-config autoconf automake libtool libssl-dev

      - name: Install .NET runtime for PkgTool.Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch OpenOrbis toolchain
        working-directory: psbox
        run: tools/ps4/fetch-toolchain.sh

      - name: Configure PS4 Release
        working-directory: psbox
        run: |
          cmake -S . -B build-ps4 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ps4.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build PS4 (verbose diagnostics)
        working-directory: psbox
        run: ninja -C build-ps4 -v

      - name: Package PS4 PKG
        working-directory: psbox
        run: tools/ps4/package.sh build-ps4

      - name: Collect build diagnostics on failure
        if: failure()
        working-directory: psbox
        run: |
          mkdir -p build-ps4/diagnostics
          cp build-ps4/CMakeCache.txt build-ps4/diagnostics/ 2>/dev/null || true
          cp build-ps4/build.ninja build-ps4/diagnostics/ 2>/dev/null || true
          git submodule status > build-ps4/diagnostics/submodules.txt 2>&1 || true
          git rev-parse HEAD > build-ps4/diagnostics/upstream-commit.txt
          find build-ps4 -maxdepth 2 -type f -name '*.log' -exec cp {} build-ps4/diagnostics/ + 2>/dev/null || true

      - name: Validate package and generate checksum
        working-directory: psbox
        run: |
          pkg_dir="build-ps4/pkg"
          pkg="$(find "$pkg_dir" -maxdepth 1 -type f -name '*.pkg' -print -quit)"
          test -n "$pkg" || { echo "No PKG generated" >&2; exit 1; }
          sha256sum "$pkg" > "$pkg.sha256"
          {
            echo "Upstream repository: RafaelNGP/psbox-cloud-gaming"
            echo "Pinned commit: 40c61da5fc9720e5078b0d1473931864488aa1b1"
            echo "Build target: PS4 / OpenOrbis"
            echo "Build type: Release"
            echo "Package: $(basename "$pkg")"
            echo "Created UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "$pkg_dir/build-info.txt"
          cat "$pkg.sha256"
          cat "$pkg_dir/build-info.txt"

      - name: Upload diagnostics (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: psbox-ps4-build-diagnostics
          path: psbox/build-ps4/diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload upstream baseline PKG and build proof
        uses: actions/upload-artifact@v4
        with:
          name: psbox-ps4-baseline-pkg
          path: |
            psbox/build-ps4/pkg/*.pkg
            psbox/build-ps4/pkg/*.sha256
            psbox/build-ps4/pkg/build-info.txt
          if-no-files-found: error
          retention-days: 7
