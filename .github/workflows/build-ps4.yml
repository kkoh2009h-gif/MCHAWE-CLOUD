name: Build MCHAWE CLOUD PS4

on:
  workflow_dispatch:
  push:
    paths:
      - 'ps4/**'
      - '.github/workflows/build-ps4.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native PS4 ELF with OpenOrbis
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.4
          command: cd ps4 && make
      - name: Create native build manifest and checksums
        working-directory: ps4
        run: |
          mkdir -p build
          {
            echo "Project: MCHAWE CLOUD"
            echo "Build type: Native PS4 scaffold (not PKG)"
            echo "Commit: $GITHUB_SHA"
            echo "Built UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "OpenOrbis toolchain: v0.5.4"
          } > build/build-info.txt
          find eboot.bin build -type f \( -name '*.elf' -o -name '*.oelf' -o -name 'eboot.bin' \) -print0 | xargs -0 sha256sum > build/SHA256SUMS

      - name: Upload native scaffold outputs (not PKG)
        uses: actions/upload-artifact@v4
        with:
          name: MCHAWE-CLOUD-PS4-native-scaffold
          path: |
            ps4/eboot.bin
            ps4/build/*.elf
            ps4/build/*.oelf
            ps4/build/build-info.txt
            ps4/build/SHA256SUMS
